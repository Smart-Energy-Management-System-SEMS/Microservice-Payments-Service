name: Keep Render Service Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          KEEPALIVE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "Repository variable RENDER_SERVICE_URL is not configured."
            echo "Set it to https://your-service.onrender.com/health"
            exit 1
          fi
          echo "Pinging $KEEPALIVE_URL"
          curl -L --fail --max-time 20 "$KEEPALIVE_URL"
