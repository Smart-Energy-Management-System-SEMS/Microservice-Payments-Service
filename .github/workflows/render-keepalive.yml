name: render-keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate URL variable
        run: |
          if [ -z "${RENDER_SERVICE_URL}" ]; then
            echo "Missing RENDER_SERVICE_URL variable"
            exit 1
          fi
      - name: Ping service
        run: |
          curl --fail --silent --show-error --max-time 20 "${RENDER_SERVICE_URL}"
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
