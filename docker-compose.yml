services:
  payments-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payments-service
    env_file:
      - .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8086}
      API_BASE_PATH: ${API_BASE_PATH:-/api/v1}
      KAFKA_BROKERS: kafka:29092
      KAFKA_ENSURE_TOPICS: "false"
      KAFKA_TOPIC_PAYMENTS_EVENTS: payments.events
      KAFKA_TOPIC_BILLING_EVENTS: billing.events
      KAFKA_TOPIC_SUBSCRIPTIONS_EVENTS: subscriptions.events
    ports:
      - "${SERVER_PORT:-8086}:${SERVER_PORT:-8086}"
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    networks:
      - sems-payments-network

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: payments-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped
    networks:
      - sems-payments-network

  kafka-topics-init:
    image: bitnami/kafka:3.7.0
    container_name: payments-kafka-topics-init
    depends_on:
      kafka:
        condition: service_started
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic subscriptions.events --partitions 1 --replication-factor 1 &&
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payments.events --partitions 1 --replication-factor 1 &&
        /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic billing.events --partitions 1 --replication-factor 1
    restart: "no"
    networks:
      - sems-payments-network

networks:
  sems-payments-network:
    driver: bridge

volumes:
  kafka_data:
